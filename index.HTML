<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/bootstrap.bundle.js">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://kit.fontawesome.com/675c803dae.js" crossorigin="anonymous"></script>
    <title>DHL</title>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            <img src="IMG/dhl-logo.svg" alt="">
        </div>

        <div class="navbar-links">
            <p><i class="fa-regular fa-compass"></i>
                Find a service point</p>
            <p><i class="fa-solid fa-magnifying-glass"></i>
                Search</p>
            <p><i class="fa-solid fa-globe"></i>
                Nigeria</p>
        </div>

    </div>
    <div class="navbar2">
        <div class="navbar21">
            <p>Track</p>
            <p>Ship
                <i class="fa-solid fa-angle-down"></i>
            </p>
            <p>Customer Service</p>
        </div>

        <div class="navbar22">
            <p>Customer Portal Logins
                <i class="fa-solid fa-angle-down"></i>
            </p>
        </div>

    </div>

    <div class="centerpiece">
        <div class="centerpiece-box">
            <P>TRACK YOUR SHIPMENT</P>
            
            <div class="srbox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Enter Your Tracking Number (s)">
                <button>Track</button>
            </div>

        </div>
    </div>

    <div class="functions">
        <div class="functions-text">
            <i class="fa-solid fa-calendar-days"></i>
            <h2>Ship Now</h2>
            <p>Find the right service</p>
        </div>

        <div class="functions-text">
            <i class="fa-regular fa-file"></i>
            <h2>Get a Quote</h2>
            <p>Estimate cost to share and compare</p>
        </div>

        <div class="functions-text" id="incr">
            <i class="fa-solid fa-building"></i>
            <h2>DHL for Business</h2>
            <p>Shipping regularly? Request a business account and profit from exclusive benefits</p>
        </div>

    </div>

    <div class="mission"></div>
</body>

</html>
